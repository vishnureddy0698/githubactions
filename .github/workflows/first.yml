name: Testing
on:
  push:
    branches: "main"
  workflow_dispatch:
jobs:
  workflowtesting:
    env:
      testing: rajesh
    runs-on: centop-rfsh
    steps:
      - name : Chckeout to github repo
        uses: actions/checkout@v4
      - name: This step used for Testing
        run: echo "This is" ${{ env.testing }}
      - name: Login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.PASSWORD_TOKEN}}
      - name: Building docker images
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/docker-test:v1 .
      - name: Pushing docker images
        run: docker push ${{ secrets.PASSWORD_TOKEN }}/docker-test:v1